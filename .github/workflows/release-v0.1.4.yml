name: Release v0.1.4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.1.4.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested source
        uses: actions/checkout@v4
        with:
          ref: 4b5014be806d4f9165cc537af431c1a96bb40db9
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build
        run: gradle clean build --stacktrace
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.4 \
            build/libs/MiraShop-0.1.4.jar \
            --target 4b5014be806d4f9165cc537af431c1a96bb40db9 \
            --title "MiraShop v0.1.4" \
            --notes "Adds exact custom ItemStack shop entries so names, lore, PDC and typed MiraSpawners survive purchases and sales. Migrates existing shops once to typed Chicken, Pig, Cow, Zombie, Skeleton, Polar Bear, Blaze, Evoker and Iron Golem spawner presets, applies the requested mob-drop sell values, and prevents buy/sell arbitrage where an old buy price is below the new sell value."
