name: Release v0.1.3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.1.3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build
        run: gradle clean build --stacktrace
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.3 \
            build/libs/MiraShop-0.1.3.jar \
            --target "${GITHUB_SHA}" \
            --title "MiraShop v0.1.3" \
            --notes "Adds protected /sell, /sellhand and /sell hand GUI selling, moves the shop balance to bottom-centre, removes the Close button, forces MiraShop sell prices into Essentials worth, protects named/custom items, and disables selling armor, weapons and tools."
