name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build
        run: gradle clean build --stacktrace
      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: MiraShop-0.1.12
          path: build/libs/MiraShop-0.1.12.jar
      - name: Publish v0.1.12 release if missing
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v0.1.12 >/dev/null 2>&1; then
            gh release create v0.1.12 \
              build/libs/MiraShop-0.1.12.jar \
              --target "${{ github.sha }}" \
              --title "MiraShop v0.1.12" \
              --notes "Adds the public cached typed-spawner buy-price service and SpawnerPriceCacheEvent so MiraFactions can consume price changes without reading MiraShop files."
          fi
