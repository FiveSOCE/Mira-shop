name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build
        run: gradle clean build --stacktrace
      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: MiraShop-0.1.9
          path: build/libs/MiraShop-0.1.9.jar
      - name: Publish v0.1.9 release if missing
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v0.1.9 >/dev/null 2>&1; then
            gh release create v0.1.9 \
              build/libs/MiraShop-0.1.9.jar \
              --target "${{ github.sha }}" \
              --title "MiraShop v0.1.9" \
              --notes "Redesigns the transaction GUI into a compact 3-row layout with the item top-center, Buy 64/10/1 on the left, Sell 1/10/64 on the right, and the 1-item buttons closest to the item."
          fi
