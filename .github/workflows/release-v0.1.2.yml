name: Release v0.1.2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.1.2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build
        run: gradle clean build --stacktrace
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.2 \
            build/libs/MiraShop-0.1.2.jar \
            --target "${GITHUB_SHA}" \
            --title "MiraShop v0.1.2" \
            --notes "Redesigns the player shop GUI with a compact 9x3 glowing-glass main menu, live balance display, non-italic text, dynamic section sizing, the new Spawners section, removal of Tools/Armor/Brewing/Misc, and held-item /mshop setprice <price> with Essentials worth synchronisation."
