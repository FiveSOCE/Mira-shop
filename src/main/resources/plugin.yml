name: MiraShop
version: 0.1.7
main: com.mira.shop.MiraShopPlugin
api-version: '1.21'
authors: [FiveS]
description: GUI economy shop for the Mira plugin ecosystem.
softdepend: [Vault, Essentials, MiraSpawners]
commands:
  shop:
    description: Open or search the Mira shop.
    usage: /shop [section|search <item>]
    permission: mirashop.use
  sellall:
    description: Sell matching items from your inventory.
    usage: /sellall <hand|inventory|material>
    permission: mirashop.sellall
  mshop:
    description: MiraShop administration and economy analytics.
    usage: /mshop [edit|reload|stats|eco|export|setprice|addhand|remove]
    permission: mirashop.admin
permissions:
  mirashop.use:
    default: true
  mirashop.buy:
    default: true
  mirashop.sell:
    default: true
  mirashop.sellall:
    default: true
  mirashop.admin:
    default: op
  mirashop.section.*:
    default: true
